name: Build and Deploy APK to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Web Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare GitHub Pages Output
        run: |
          mkdir public_pages
          cp android/app/build/outputs/apk/debug/app-debug.apk public_pages/SignalStrength.apk
          cat > public_pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cell Tower Mapper</title>
            <style>
              * { box-sizing: border-box; }
              body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                text-align: center;
                padding: 50px 20px;
                background: #0f172a;
                color: #f8fafc;
                margin: 0;
              }
              h1 { font-size: 32px; margin-bottom: 12px; }
              p { color: #cbd5e1; margin-bottom: 32px; line-height: 1.5; }
              .btn {
                display: inline-block;
                padding: 16px 32px;
                background: #2563eb;
                color: white;
                text-decoration: none;
                border-radius: 8px;
                font-size: 18px;
                font-weight: 600;
                transition: background 0.2s;
              }
              .btn:hover { background: #1d4ed8; }
              .steps {
                max-width: 480px;
                margin: 40px auto 0;
                text-align: left;
                color: #94a3b8;
                font-size: 14px;
              }
              .steps li { margin-bottom: 8px; }
              footer { margin-top: 60px; font-size: 12px; color: #64748b; }
            </style>
          </head>
          <body>
            <h1>Cell Tower Mapper</h1>
            <p>Download the latest Android build and start mapping LTE/5G signal strength in your area.</p>
            <a class="btn" href="./SignalStrength.apk" download>Download APK</a>
            <ul class="steps">
              <li>Tap the button above to download the APK on your Android phone.</li>
              <li>Open the downloaded file and allow installation from your browser.</li>
              <li>Launch the app and grant Location & Phone permissions.</li>
              <li>Tap <strong>Start Tracking</strong> and drive or walk your route.</li>
            </ul>
            <footer>Built with React, Capacitor, and Leaflet.</footer>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_pages
          force_orphan: true
